# Форма, которую ищет правило:
#   $SZ = ... + $BLOCK + ... * $COUNT;
#   if ($BLOCK < $SCALE * $CH) { ... }
#   $DEST = malloc($SZ);  или  $DEST = calloc($N, $SZ);
# при этом $COUNT в функции не сравнивается с произведением.
# Имена, число слагаемых и значение $SCALE произвольны: литерал 7 не зашит.
# Ожидаемо: 1.0.30 — 1 находка, 1.1.0 — 0, fixture — 2.
rules:
  - id: lab4-msadpcm-block-size
    languages: [c]
    severity: ERROR
    message: >
      Слагаемое размера malloc/calloc сравнивается с произведением, а другой
      множитель того же размера так не ограничен. Литерал 7 не требуется.
      Для MS ADPCM так выглядит слабая проверка преамбулы (CVE-2021-3246).
    metadata:
      cwe:
        - "CWE-787: Out-of-bounds Write"
      references:
        - https://nvd.nist.gov/vuln/detail/CVE-2021-3246
        - https://github.com/libsndfile/libsndfile/issues/687
    patterns:
      # Секции patterns: складываются по И: находка будет только если
      # выполнились и сравнение, и вычисление размера, и вызов аллокатора.

      # 1. Условие вида "слагаемое < множитель * что-то"
      - pattern-either:
          - pattern: |
              if ($BLOCK < $SCALE * $CH) { ... }
          - pattern: |
              if ($BLOCK < $SCALE * $CH)
                $STMT;
      # 2. В той же функции размер сначала считается в переменную.
      - pattern-inside: |
          $RET $FN(...) {
            ...
            $SZ = $HEAD + $BLOCK + $K * $MID * $COUNT;
            ...
          }
      # 3. Этот размер передаётся в malloc или calloc.
      - pattern-either:
          - pattern-inside: |
              $RET $FN(...) {
                ...
                if (! ($DEST = calloc($N, $SZ)))
                  $S;
                ...
              }
          - pattern-inside: |
              $RET $FN(...) {
                ...
                if (!calloc($N, $SZ))
                  $S;
                ...
              }
          - pattern-inside: |
              $RET $FN(...) {
                ...
                $DEST = calloc($N, $SZ);
                ...
              }
          - pattern-inside: |
              $RET $FN(...) {
                ...
                $DEST = malloc($SZ);
                ...
              }
          - pattern-inside: |
              $RET $FN(...) {
                ...
                if (! ($DEST = malloc($SZ)))
                  $S;
                ...
              }
          - pattern-inside: |
              $RET $FN(...) {
                ...
                if (!malloc($SZ))
                  $S;
                ...
              }
      # 4. Если $COUNT сам сравнивается с произведением, это уже исправленный
      #    вариант (как в libsndfile 1.1.0), поэтому находку не выдаём.
      #    Две формы if — как в шаге 1.
      - pattern-not-inside: |
          $RET $FN(...) {
            ...
            if ($COUNT < $SCALE2 * $X) { ... }
            ...
          }
      - pattern-not-inside: |
          $RET $FN(...) {
            ...
            if ($COUNT < $SCALE2 * $X)
              $S2;
            ...
          }
